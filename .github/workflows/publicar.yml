# Publica o site no GitHub Pages sempre que algo muda no repositório
# (inclusive quando o painel salva um destaque).
# Enquanto a variável SITE_OFICIAL não for "sim", sai a VERSÃO DE TESTE (fora do Google).
name: Publicar site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar as fontes (para o site não depender do Google Fonts)
        run: python3 baixar_fontes.py
      - name: Instalar o Pillow (marca d'água das fotos)
        run: pip install pillow
      - name: Gerar as páginas
        run: python3 build.py ${{ vars.SITE_OFICIAL == 'sim' && '--oficial' || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
