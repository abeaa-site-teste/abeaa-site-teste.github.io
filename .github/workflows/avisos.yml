# Confere todo dia, às 8h (horário de Brasília), se algum destaque do site vence
# nos próximos 3 dias. Se vencer, abre um aviso no GitHub, que chega por e-mail.
# Só avisa: não apaga nem esconde nenhuma notícia.
name: Avisos de vencimento
on:
  schedule:
    - cron: "7 11 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conferir vencimentos
        env:
          GH_TOKEN: ${{ github.token }}
          DONO: ${{ github.repository_owner }}
        run: python3 avisos.py
