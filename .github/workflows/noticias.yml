# Robô de notícias: todo dia às 8h52 (Brasília) atualiza atualizacoes.json.
# Gratuito no GitHub Actions. Também pode ser rodado à mão em Actions > "Notícias" > Run workflow.
name: Notícias
on:
  schedule:
    - cron: "52 11 * * *"   # 11h52 UTC = 8h52 em Brasília
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar notícias do CREA-SP e do Confea
        run: python3 robo/atualizar_noticias.py atualizacoes.json
      - name: Salvar se mudou
        run: |
          git config user.name "robo-noticias"
          git config user.email "robo-noticias@users.noreply.github.com"
          git add atualizacoes.json
          git diff --cached --quiet || (git commit -m "Notícias atualizadas" && git push)
      # Observação: commits feitos pelo robô com o GITHUB_TOKEN não disparam outro workflow.
      # Por isso o passo abaixo chama a publicação diretamente.
      - name: Publicar o site com as notícias novas
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar.yml
      # Se alguma fonte falhou, a execução termina em vermelho e o GitHub avisa por e-mail.
      - name: Avisar se alguma fonte falhou
        run: if [ -f robo_problemas.txt ]; then cat robo_problemas.txt; exit 1; fi
